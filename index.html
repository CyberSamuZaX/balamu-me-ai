<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPT AI - බුදු දහම පිළිතුරු</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>KPT AI</h1>
    <p>ඔබට තිබෙන බුදු දහම සම්බන්ධ ප්‍රශ්නයක් ඇසන්න</p>
    
    <div class="chat-box" id="chat-box">
      <!-- Messages will appear here -->
    </div>

    <form id="chat-form">
      <input type="text" id="user-input" placeholder="ඔබේ ප්‍රශ්නය මෙහි ලියන්න..." required>
      <button type="submit">අවසන්</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
